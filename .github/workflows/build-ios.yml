name: Build iOS IPA (No-Mac Cloud Builder)

on:
  workflow_dispatch:
  push:
    paths:
      - 'BConnect_iOS/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ipa:
    name: Build B-Connect iOS IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inspect Xcode Environment
        run: |
          xcodebuild -version
          xcodebuild -project BConnect_iOS/BConnect.xcodeproj -list

      - name: Build iOS Application (.app)
        run: |
          set +e
          xcodebuild build \
            -project BConnect_iOS/BConnect.xcodeproj \
            -scheme BConnect \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES > build.log 2>&1
          BUILD_EXIT=$?
          echo "=== XCODEBUILD LOG TAIL ==="
          tail -n 120 build.log
          if [ $BUILD_EXIT -ne 0 ]; then
            exit $BUILD_EXIT
          fi

      - name: Package Payload into .IPA
        run: |
          mkdir -p build/Payload
          APP_PATH=$(find build/DerivedData -name "BConnect.app" -type d | head -n 1)
          echo "Found compiled app at: $APP_PATH"
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr9 B-Connect-iOS.ipa Payload
          ls -lh B-Connect-iOS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: B-Connect-iOS-IPA
          path: build/B-Connect-iOS.ipa
          retention-days: 30
