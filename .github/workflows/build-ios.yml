name: Build iOS IPA (No-Mac Cloud Builder)

on:
  workflow_dispatch:
  push:
    paths:
      - 'BConnect_iOS/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ipa:
    name: Build B-Connect iOS IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build Xcode Archive
        run: |
          xcodebuild archive \
            -project BConnect_iOS/BConnect.xcodeproj \
            -scheme BConnect \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/BConnect.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Payload into .IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/BConnect.xcarchive/Products/Applications/BConnect.app" build/Payload/
          cd build
          zip -qr9 B-Connect-iOS.ipa Payload
          ls -lh B-Connect-iOS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: B-Connect-iOS-IPA
          path: build/B-Connect-iOS.ipa
          retention-days: 30

      - name: Publish Direct Release (Optional Automatic Distribution)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: build/B-Connect-iOS.ipa
          name: "B-Connect iOS Release ${{ github.ref_name }}"
          draft: false
          prerelease: false
