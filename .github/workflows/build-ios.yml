name: Build iOS IPA (No-Mac Cloud Builder)

on:
  workflow_dispatch:
  push:
    paths:
      - 'BConnect_iOS/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ipa:
    name: Build B-Connect iOS IPA
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Latest Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Build iOS Application (.app)
        run: |
          xcodebuild build \
            -project BConnect_iOS/BConnect.xcodeproj \
            -scheme BConnect \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package Payload into .IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/DerivedData/Build/Products/Release-iphoneos/BConnect.app" build/Payload/
          cd build
          zip -qr9 B-Connect-iOS.ipa Payload
          ls -lh B-Connect-iOS.ipa

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: B-Connect-iOS-IPA
          path: build/B-Connect-iOS.ipa
          retention-days: 30
