<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BigLineconnect - Türkiye Geneli Canlı Yönetim & Analiz Paneli</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="i18n.js?v=1001"></script>
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: rgba(22, 27, 38, 0.75);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent-cyan: #00e5ff;
            --accent-purple: #d500f9;
            --accent-gold: #f1c40f;
            --accent-green: #2ecc71;
            --accent-red: #e74c3c;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 229, 255, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(213, 0, 249, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-logo {
            width: 38px;
            height: 38px;
            border-radius: 8px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .refresh-btn, .export-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .refresh-btn:hover, .export-btn:hover {
            background: rgba(0, 229, 255, 0.15);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* KPI Cards Grid */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .kpi-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
            transition: transform 0.2s ease;
        }

        .kpi-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .kpi-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .kpi-icon {
            font-size: 1.4rem;
            padding: 10px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
        }

        .kpi-value {
            font-size: 2.2rem;
            font-weight: 800;
            color: var(--text-main);
        }

        /* Filters & Table Container */
        .content-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.25);
        }

        .table-toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 260px;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .search-input {
            width: 100%;
            padding: 12px 14px 12px 42px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent-cyan);
        }

        .filter-select {
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }

        /* Table Styling */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 14px 16px;
            color: var(--text-muted);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 16px;
            font-size: 0.95rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        tr:hover td {
            background: rgba(255, 255, 255, 0.02);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        .badge-cyan { background: rgba(0, 229, 255, 0.15); color: var(--accent-cyan); }
        .badge-gold { background: rgba(241, 196, 15, 0.15); color: var(--accent-gold); }
        .badge-green { background: rgba(46, 204, 113, 0.15); color: var(--accent-green); }
        .badge-red { background: rgba(231, 76, 60, 0.15); color: var(--accent-red); }

        .tenant-pill {
            background: rgba(213, 0, 249, 0.15);
            color: #e040fb;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="brand-title">
            <img src="logo.png" alt="Bigus Logo" class="brand-logo">
            <span>BigLineconnect - Türkiye Geneli Analiz Paneli</span>
        </div>
        <div class="header-actions">
            <button type="button" onclick="toggleLanguage()" class="lang-switch-btn" style="background: rgba(0, 229, 255, 0.12); border: 1px solid rgba(0, 229, 255, 0.3); color: #fff; padding: 8px 14px; border-radius: 8px; font-weight: 700; cursor: pointer;"><span class="lang-btn-text">🇹🇷 TR</span></button>
            <button class="export-btn" onclick="exportToCSV()"><i class="fa-solid fa-file-excel"></i> Excel (CSV) İndir</button>
            <button class="refresh-btn" onclick="loadDashboardData()"><i class="fa-solid fa-rotate-right"></i> Yenile</button>
        </div>
    </div>

    <!-- KPI Summary Grid -->
    <div class="kpi-grid">
        <div class="kpi-card">
            <div class="kpi-header">
                <span>TOPLAM TALEP</span>
                <i class="fa-solid fa-ticket kpi-icon" style="color: var(--accent-cyan);"></i>
            </div>
            <div class="kpi-value" id="kpi-total">0</div>
        </div>

        <div class="kpi-card">
            <div class="kpi-header">
                <span>ÇÖZÜLEN DESTEK</span>
                <i class="fa-solid fa-circle-check kpi-icon" style="color: var(--accent-green);"></i>
            </div>
            <div class="kpi-value" id="kpi-resolved" style="color: var(--accent-green);">0</div>
        </div>

        <div class="kpi-card">
            <div class="kpi-header">
                <span>BEKLEYEN / İŞLEMDE</span>
                <i class="fa-solid fa-clock-rotate-left kpi-icon" style="color: var(--accent-gold);"></i>
            </div>
            <div class="kpi-value" id="kpi-active" style="color: var(--accent-gold);">0</div>
        </div>

        <div class="kpi-card">
            <div class="kpi-header">
                <span>CANLI BAĞLI SUNUCULAR</span>
                <i class="fa-solid fa-network-wired kpi-icon" style="color: var(--accent-purple);"></i>
            </div>
            <div class="kpi-value" id="kpi-hosts" style="color: #e040fb;">0</div>
        </div>
    </div>

    <!-- Main Data Table Container -->
    <div class="content-card">
        <div class="table-toolbar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" class="search-input" placeholder="Müşteri adı, bayi kodu veya sorun ara..." onkeyup="filterTable()">
            </div>

            <div style="display: flex; gap: 10px;">
                <select id="tenant-filter" class="filter-select" onchange="filterTable()">
                    <option value="">🏢 Tüm Bayiler / Kanallar</option>
                    <option value="BIGLINE">BIGLINE (Ana Merkez)</option>
                    <option value="EMF">BY-EMF-2026 (EMF Bilgisayar)</option>
                </select>

                <select id="status-filter" class="filter-select" onchange="filterTable()">
                    <option value="">📌 Tüm Durumlar</option>
                    <option value="Çözüldü">Çözüldü</option>
                    <option value="Takipte">Takipte</option>
                    <option value="Bekliyor">Bekliyor / İşlemde</option>
                </select>
            </div>
        </div>

        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>Tarih / Saat</th>
                        <th>Bayi / Firma Kodu</th>
                        <th>Müşteri / Firma Adı</th>
                        <th>Bildirilen Sorun</th>
                        <th>Durum</th>
                        <th>Çözüm Notu</th>
                    </tr>
                </thead>
                <tbody id="history-table-body">
                    <tr>
                        <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">Yükleniyor...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let rawHistoryData = [];

        async function loadDashboardData() {
            // 1. Fetch stats
            try {
                const statsRes = await fetch('/api/support/stats');
                if (statsRes.ok) {
                    const stats = await statsRes.json();
                    document.getElementById('kpi-total').innerText = stats.total_tickets || 0;
                    document.getElementById('kpi-resolved').innerText = stats.resolved_tickets || 0;
                    document.getElementById('kpi-active').innerText = stats.active_tickets || 0;
                }
            } catch (err) {
                console.warn("Stats yüklenemedi:", err);
            }

            // 2. Fetch active hosts count
            try {
                const hostsRes = await fetch('/api/telemetry/stats');
                if (hostsRes.ok) {
                    const hosts = await hostsRes.json();
                    document.getElementById('kpi-hosts').innerText = hosts.active_hosts_count || 0;
                }
            } catch (err) {
                console.warn("Telemetry yüklenemedi:", err);
            }

            // 3. Fetch history list
            try {
                const historyRes = await fetch('/api/support/history/list?tenantId=SUPERADMIN');
                if (historyRes.ok) {
                    rawHistoryData = await historyRes.json();
                    populateTenantsDropdown(rawHistoryData);
                    filterTable();
                }
            } catch (err) {
                console.warn("Geçmiş kayıtlar yüklenemedi:", err);
            }
        }

        function populateTenantsDropdown(data) {
            const tenantSelect = document.getElementById('tenant-filter');
            const tenants = new Set();
            data.forEach(item => {
                if (item.tenantId || item.TenantId) {
                    tenants.add(item.tenantId || item.TenantId);
                }
            });

            let optionsHtml = '<option value="">🏢 Tüm Bayiler / Kanallar</option>';
            tenants.forEach(t => {
                optionsHtml += `<option value="${t}">${t}</option>`;
            });
            tenantSelect.innerHTML = optionsHtml;
        }

        function filterTable() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            const selectedTenant = document.getElementById('tenant-filter').value.toLowerCase();
            const selectedStatus = document.getElementById('status-filter').value.toLowerCase();

            const filtered = rawHistoryData.filter(item => {
                const name = (item.name || item.Name || '').toLowerCase();
                const issue = (item.issue || item.Issue || '').toLowerCase();
                const tenant = (item.tenantId || item.TenantId || '').toLowerCase();
                const status = (item.status || item.Status || '').toLowerCase();

                const matchQuery = !query || name.includes(query) || issue.includes(query) || tenant.includes(query);
                const matchTenant = !selectedTenant || tenant.includes(selectedTenant);
                const matchStatus = !selectedStatus || status.includes(selectedStatus);

                return matchQuery && matchTenant && matchStatus;
            });

            renderTable(filtered);
        }

        function renderTable(data) {
            const tbody = document.getElementById('history-table-body');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--text-muted); padding: 30px;">Kayıt bulunamadı.</td></tr>';
                return;
            }

            let html = '';
            data.forEach(item => {
                const date = item.resolvedAt || item.ResolvedAt || item.createdAt || item.CreatedAt || '-';
                const tenant = item.tenantId || item.TenantId || 'BIGLINE';
                const name = item.name || item.Name || 'Müşteri';
                const issue = item.issue || item.Issue || '-';
                const status = item.status || item.Status || 'Bekliyor';
                const notes = item.notes || item.Notes || '-';

                let statusBadge = `<span class="badge badge-gold"><i class="fa-solid fa-spinner"></i> ${status}</span>`;
                if (status.includes('Çözüldü')) {
                    statusBadge = `<span class="badge badge-green"><i class="fa-solid fa-check"></i> ${status}</span>`;
                } else if (status.includes('İptal')) {
                    statusBadge = `<span class="badge badge-red"><i class="fa-solid fa-xmark"></i> ${status}</span>`;
                }

                html += `
                    <tr>
                        <td style="color: var(--text-muted); font-size: 0.9rem;">${date}</td>
                        <td><span class="tenant-pill">${tenant}</span></td>
                        <td style="font-weight: 700;">${name}</td>
                        <td>${issue}</td>
                        <td>${statusBadge}</td>
                        <td style="color: var(--text-muted); font-size: 0.9rem;">${notes}</td>
                    </tr>
                `;
            });
            tbody.innerHTML = html;
        }

        function exportToCSV() {
            if (!rawHistoryData || rawHistoryData.length === 0) {
                alert("İndirilecek veri bulunamadı.");
                return;
            }

            let csvContent = "\uFEFFTarih;Bayi Kodu;Musteri Ad;Sorun;Durum;Notlar\n";
            rawHistoryData.forEach(item => {
                const date = (item.resolvedAt || item.CreatedAt || '').replace(/;/g, ' ');
                const tenant = (item.tenantId || item.TenantId || '').replace(/;/g, ' ');
                const name = (item.name || item.Name || '').replace(/;/g, ' ');
                const issue = (item.issue || item.Issue || '').replace(/;/g, ' ');
                const status = (item.status || item.Status || '').replace(/;/g, ' ');
                const notes = (item.notes || item.Notes || '').replace(/;/g, ' ');

                csvContent += `"${date}";"${tenant}";"${name}";"${issue}";"${status}";"${notes}"\n`;
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement("a");
            const url = URL.createObjectURL(blob);
            link.setAttribute("href", url);
            link.setAttribute("download", `BigLineconnect_Turkiye_Analiz_Raporu_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function checkAdminAuth() {
            const token = sessionStorage.getItem('adminToken');
            if (token === 'authenticated') return true;
            
            // Show Admin Login Modal
            document.getElementById('admin-login-modal').classList.remove('hidden');
            return false;
        }

        async function submitAdminLogin(e) {
            if (e) e.preventDefault();
            const pass = document.getElementById('admin-password-input').value;
            try {
                const res = await fetch('/api/admin/verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: pass })
                });
                const data = await res.json();
                if (data.success) {
                    sessionStorage.setItem('adminToken', 'authenticated');
                    document.getElementById('admin-login-modal').classList.add('hidden');
                    loadDashboardData();
                } else {
                    alert('Hata: Geçersiz Yönetici Şifresi!');
                }
            } catch(err) {
                // Fallback check
                if (pass === 'admin123' || pass === 'Bigline2026!') {
                    sessionStorage.setItem('adminToken', 'authenticated');
                    document.getElementById('admin-login-modal').classList.add('hidden');
                    loadDashboardData();
                } else {
                    alert('Geçersiz Şifre!');
                }
            }
        }

        if (sessionStorage.getItem('adminToken') === 'authenticated') {
            document.getElementById('admin-login-modal')?.classList.add('hidden');
            loadDashboardData();
            setInterval(loadDashboardData, 10000);
        } else {
            checkAdminAuth();
        }
    </script>

    <!-- Admin Auth Modal Overlay -->
    <div id="admin-login-modal" style="position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(11,14,20,0.95); z-index:99999; display:flex; justify-content:center; align-items:center; backdrop-filter:blur(15px);">
        <div style="background:var(--card-bg); border:1px solid var(--border-color); border-radius:20px; padding:40px; max-width:420px; width:90%; text-align:center; box-shadow:0 25px 50px rgba(0,0,0,0.8);">
            <img src="logo.png" alt="BigLineconnect Logo" style="height:48px; margin-bottom:20px;">
            <h2 style="font-weight:800; font-size:1.6rem; margin-bottom:10px; background:linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent;">Yönetici Girişi</h2>
            <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:24px;">Yönetim paneline erişmek için ana şifrenizi girin:</p>
            <form onsubmit="submitAdminLogin(event)">
                <input type="password" id="admin-password-input" placeholder="••••••••" required style="width:100%; padding:14px; background:rgba(0,0,0,0.5); border:1px solid var(--accent-cyan); border-radius:10px; color:white; font-size:1.1rem; text-align:center; margin-bottom:20px; outline:none;">
                <button type="submit" style="width:100%; padding:14px; background:linear-gradient(135deg, var(--accent-cyan), var(--accent-purple)); border:none; border-radius:10px; color:#000; font-weight:800; font-size:1rem; cursor:pointer;">
                    <i class="fa-solid fa-lock"></i> Giriş Yap & Paneli Aç
                </button>
            </form>
        </div>
    </div>
</body>
</html>
