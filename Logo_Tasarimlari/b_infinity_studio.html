<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>b-connect: Kart Formatında Canlı Logo Tasarımları</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Segoe+UI:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #07090e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #00e5ff; font-family: 'Outfit', sans-serif; font-size: 26px; margin-bottom: 6px; }
        p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 24px; text-align: center; }

        .cards-container {
            display: flex;
            gap: 32px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 900px;
        }

        .phone-card {
            width: 320px;
            background: linear-gradient(180deg, #0e121a 0%, #080a0f 100%);
            border: 2px solid #243048;
            border-radius: 28px;
            padding: 36px 24px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            min-height: 480px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(0, 229, 255, 0.15);
            position: relative;
            transition: all 0.3s ease;
        }
        .phone-card:hover {
            border-color: #00e5ff;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 40px rgba(0, 229, 255, 0.35);
            transform: translateY(-4px);
        }

        .card-tag {
            position: absolute;
            top: -12px;
            background: #00e5ff;
            color: #000;
            font-weight: 900;
            font-size: 11px;
            padding: 4px 14px;
            border-radius: 12px;
            letter-spacing: 0.5px;
        }

        .b-top-letter {
            font-size: 54px;
            font-weight: 900;
            color: #00e5ff;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.8);
            line-height: 1;
            font-family: 'Outfit', sans-serif;
            margin-bottom: 8px;
        }

        .infinity-mid svg {
            width: 130px;
            height: 65px;
            filter: drop-shadow(0 0 16px rgba(0, 229, 255, 0.7)) drop-shadow(0 0 24px rgba(213, 0, 249, 0.5));
        }

        .connect-bottom-text {
            font-size: 38px;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.5px;
            font-family: 'Segoe UI', sans-serif;
            margin-top: 24px;
        }

        /* CARD B: b and infinity combined */
        .b-infinity-combined svg {
            width: 170px;
            height: 95px;
            filter: drop-shadow(0 0 16px rgba(0, 229, 255, 0.7)) drop-shadow(0 0 24px rgba(213, 0, 249, 0.5));
        }
    </style>
</head>
<body>
    <h1>🎨 İstenen Kart Formatında Logo Karşılaştırması</h1>
    <p class="subtitle">Verdiğiniz görsel kart formatında küçük 'b' ve 2 tık küçültülmüş sonsuzluk amblemleri</p>

    <div class="cards-container">
        <!-- CARD A -->
        <div class="phone-card">
            <span class="card-tag">TASARIM A (ÜSTTE KÜÇÜK b)</span>
            
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; margin-top: 20px;">
                <div class="b-top-letter">b</div>
                
                <div class="infinity-mid">
                    <svg viewBox="0 0 40 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M10 4C6.13401 4 3 7.13401 3 11C3 14.866 6.13401 18 10 18C13.866 18 16.5 14.866 20 11C23.5 7.13401 26.134 4 30 4C33.866 4 37 7.13401 37 11C37 14.866 33.866 18 30 18C26.134 18 23.5 14.866 20 11C16.5 7.13401 13.866 4 10 4Z" stroke="url(#infGradCardA)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                        <defs>
                            <linearGradient id="infGradCardA" x1="3" y1="11" x2="37" y2="11" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#00E5FF"/>
                                <stop offset="1" stop-color="#D500F9"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
            </div>

            <div class="connect-bottom-text">Connect</div>
        </div>

        <!-- CARD B -->
        <div class="phone-card">
            <span class="card-tag" style="background: #d500f9; color: #fff;">TASARIM B (BÜTÜNLEŞİK b∞)</span>
            
            <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; margin-top: 20px;">
                <div class="b-infinity-combined">
                    <svg viewBox="0 0 54 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <!-- Stem of 'b' -->
                        <path d="M10 2V21" stroke="#00E5FF" stroke-width="4" stroke-linecap="round"/>
                        <!-- Infinity body joined with b -->
                        <path d="M10 10C10 7.5 12.5 5 15.5 5C18.5 5 21.5 8 27 13C32.5 18 35.5 21 39.5 21C43.5 21 47 17.5 47 13C47 8.5 43.5 5 39.5 5C35.5 5 32.5 8 27 13C21.5 18 18.5 21 15.5 21C12.5 21 10 18.5 10 16" stroke="url(#infGradCardB)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
                        <defs>
                            <linearGradient id="infGradCardB" x1="10" y1="13" x2="47" y2="13" gradientUnits="userSpaceOnUse">
                                <stop stop-color="#00E5FF"/>
                                <stop offset="1" stop-color="#D500F9"/>
                            </linearGradient>
                        </defs>
                    </svg>
                </div>
            </div>

            <div class="connect-bottom-text">Connect</div>
        </div>
    </div>
</body>
</html>
