<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>BigLineconnect - Uzaktan Kontrol</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome for Premium Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css?v=99">
</head>
<body>
    <div class="app-container">
        <!-- Connection Screen -->
        <div id="connection-screen" class="connection-screen">
            <div class="glass-card connection-card">
                <div class="logo-wrapper">
                    <img src="logo.png" alt="Bigus Logo" class="brand-logo">
                </div>
                <h1 class="brand-title">BigLineconnect</h1>
                <p class="brand-subtitle">Güçlü ve Kesintisiz Uzaktan Erişim Sistemi</p>
                
                <div class="input-group">
                    <label for="target-id"><i class="fa-solid fa-desktop"></i> Uzaktaki Masa ID'si (Remote ID)</label>
                    <input type="text" id="target-id" placeholder="Örn: 123 456 789" style="text-align: center; letter-spacing: 2px; font-weight: 800; font-size: 1.3rem;">
                </div>
                
                <button id="connect-btn" class="primary-btn">
                    <span>Bağlan</span> <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
                
                <div class="card-footer">
                    <p><i class="fa-solid fa-shield-halved"></i> Güvenli yerel ağ bağlantısı</p>
                </div>
            </div>
        </div>

        <!-- Viewer Screen -->
        <div id="viewer-screen" class="viewer-screen hidden">
            <!-- Header bar -->
            <header class="viewer-header">
                <div class="header-left">
                    <img src="logo.png" alt="Bigus Logo" class="header-logo">
                    <span class="header-title">BigLineconnect</span>
                </div>
                <div class="header-center">
                    <div class="status-indicator connected">
                        <span class="pulse-dot"></span>
                        <span id="connection-status">Bağlı</span>
                    </div>
                </div>
                <div class="header-right">
                    <button id="fullscreen-btn" class="icon-btn" title="Tam Ekran"><i class="fa-solid fa-expand"></i></button>
                    <button id="disconnect-btn" class="icon-btn danger" title="Bağlantıyı Kes"><i class="fa-solid fa-power-off"></i></button>
                </div>
            </header>

            <!-- Remote screen rendering image -->
            <div class="canvas-container" id="canvas-container">
                <img id="screen-img" style="width: 100%; height: 100%; object-fit: contain; cursor: crosshair; display: block;">
            </div>

            <!-- Floating Controls for Mobile & Actions -->
            <div class="floating-controls">
                <button id="toggle-keyboard-btn" class="control-btn" title="Klavyeyi Aç">
                    <i class="fa-solid fa-keyboard"></i> <span>Klavye</span>
                </button>
                <button id="btn-esc" class="control-btn special-key" data-key="escape">Esc</button>
                <button id="btn-tab" class="control-btn special-key" data-key="tab">Tab</button>
                <button id="btn-ctrl-alt-del" class="control-btn action-key" title="Ctrl+Alt+Del Gönder">
                    <i class="fa-solid fa-unlock-keyhole"></i> <span>CAD</span>
                </button>
                <div class="control-group">
                    <button id="mouse-mode-btn" class="control-btn toggle-active" title="Fare Modu">
                        <i class="fa-solid fa-computer-mouse"></i> <span id="mouse-mode-text">Sol Tık</span>
                    </button>
                </div>
            </div>

            <!-- Hidden input to capture keyboard events on mobile -->
            <input type="text" id="hidden-keyboard-input" autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
    </div>

    <!-- Password Prompt Dialog -->
    <div id="password-modal" class="hidden" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 10000; display: flex; justify-content: center; align-items: center;">
        <div class="glass-card connection-card" style="max-width: 380px; padding: 30px;">
            <h3 style="margin-bottom: 15px; color: var(--accent-color); font-size: 1.5rem;">Erişim Şifresi Gerekli</h3>
            <p style="font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 20px;">Lütfen hedef bilgisayarın kişisel erişim şifresini girin:</p>
            <div class="input-group" style="margin-bottom: 20px;">
                <input type="text" id="access-password-input" placeholder="Şifre" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="text-align: center; width: 100%; padding: 14px; font-size: 18px; -webkit-text-security: disc; text-security: disc; background: rgba(0,0,0,0.6); border: 2px solid var(--accent-color); border-radius: 8px; color: white;">
            </div>
            <button id="submit-password-btn" class="primary-btn" style="padding: 12px;">Doğrula & Bağlan</button>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast hidden"></div>

    <script src="app.js?v=99"></script>
</body>
</html>
